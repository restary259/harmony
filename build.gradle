plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.5+ ships Java 21, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        // Puts the Minecraft/NeoForge classpath on the test source set.
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
    // Mixin and MixinExtras for intercepting NeoForge's modifier pipeline.
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    // Sponge Mixin powers the worldgen enforcement hooks.
    compileOnly 'net.fabricmc:sponge-mixin:0.16.4+mixin.0.8.7'
    annotationProcessor 'net.fabricmc:sponge-mixin:0.16.4+mixin.0.8.7'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
