plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.91'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.20.5+ ships Java 21, so mods target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        // Puts the Minecraft/NeoForge classpath on the test source set.
        enable()
        testedMod = mods."${mod_id}"
    }
}

repositories {
    mavenCentral()
    // Mixin and MixinExtras for intercepting NeoForge's modifier pipeline.
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    // Sponge Mixin powers the worldgen enforcement hooks.
    compileOnly 'net.fabricmc:sponge-mixin:0.16.4+mixin.0.8.7'
    annotationProcessor 'net.fabricmc:sponge-mixin:0.16.4+mixin.0.8.7'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// --- distribution ---------------------------------------------------------

// A reproducible jar manifest makes release artifacts identifiable.
tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors
        )
    }
}

java {
    withSourcesJar()
}

// Always publishes into build/repo. Setting PUBLISH_URL (with PUBLISH_USERNAME and
// PUBLISH_PASSWORD) additionally publishes to a remote maven repository.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = mod_description
                url = 'https://github.com/restary259/harmony'
                licenses {
                    license {
                        name = mod_license
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer { name = mod_authors }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'localBuild'
            url = layout.buildDirectory.dir('repo')
        }
        if (providers.environmentVariable('PUBLISH_URL').isPresent()) {
            maven {
                name = 'remote'
                url = providers.environmentVariable('PUBLISH_URL').get()
                credentials {
                    username = providers.environmentVariable('PUBLISH_USERNAME').orNull ?: ''
                    password = providers.environmentVariable('PUBLISH_PASSWORD').orNull ?: ''
                }
            }
        }
    }
}
