name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Attach jars to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "Harmony ${tag#v}" --generate-notes
          gh release upload "$tag" build/libs/harmonymod-*.jar --clobber

      - name: Publish to Modrinth
        if: ${{ env.MODRINTH_TOKEN != '' }}
        run: |
          set -eu
          project="${MODRINTH_PROJECT:-harmony}"
          version="${GITHUB_REF_NAME#v}"
          jq -n \
            --arg name "Harmony $version" \
            --arg version "$version" \
            --arg project "$project" \
            --arg file "harmonymod-$version.jar" \
            '{name:$name,version_number:$version,project_id:$project,loaders:["neoforge"],game_versions:["1.21.1"],version_type:"release",dependencies:[],file_parts:[$file],primary_file:$file}' \
            > version.json
          curl --fail --silent --show-error \
            -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=@version.json;type=application/json" \
            -F "harmonymod-$version.jar=@build/libs/harmonymod-$version.jar" \
            https://api.modrinth.com/v2/version
