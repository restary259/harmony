org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# Environment properties.
# The Minecraft version must agree with the NeoForge version to resolve a valid artifact.
minecraft_version=1.21.1
# Any release version of Minecraft may be used as a bound; pre-releases do not sort reliably.
minecraft_version_range=[1.21.1, 1.22)
neo_version=21.1.264
neo_version_range=[21.1.0,)
# The loader version range can only use the major version of FML as bounds.
loader_version_range=[4,)

# Mod properties.
mod_id=harmonymod
mod_name=Harmony
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.harmonymod
mod_authors=Raneem G Dawahade
mod_description=A universal worldgen and structure claim mediator for Minecraft modding.
