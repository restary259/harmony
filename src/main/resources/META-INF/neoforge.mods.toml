loaderVersion="[4,)"
license="MIT"
issueTrackerURL="https://github.com/restary259/harmony/issues"

[[mods]]
modId="harmonymod"
version="1.0.0"
displayName="Harmony"
displayURL="https://github.com/restary259/harmony"
logoFile="harmonymod.png"
authors="Raneem G Dawahade"
description='''
A universal worldgen and structure claim mediator for Minecraft modding.
Harmony derives worldgen ownership from registry namespaces, so biome and structure
modifiers from mods that never call its API are still attributed and enforced.
'''

[[dependencies.harmonymod]]
modId="neoforge"
type="required"
versionRange="[21.1.0,)"
ordering="NONE"
side="BOTH"

[[dependencies.harmonymod]]
modId="minecraft"
type="required"
versionRange="[1.21.1, 1.22)"
ordering="NONE"
side="BOTH"

[[mixins]]
    config = "harmonymod.mixins.json"
